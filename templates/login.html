{% extends "base.html" %}

{% block titulo %}Entrar | Pokémon RPG{% endblock %}

{% block conteudo %}
<section class="painel-login">
    <div class="cartao login-cartao ui-card">
        <p class="rotulo">Região de Ankar</p>
        <h1>Bem-vindo à campanha</h1>
        <p class="texto-suave">Entre para acessar sua ficha e as ferramentas da mesa.</p>

        <form method="post" class="formulario" action="{{ url_for('auth.login') }}">
            <label for="login">Usuário</label>
            <input id="login" name="login" value="{{ login or '' }}" autocomplete="username" required autofocus>

            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required>

            <button class="botao botao-primario" type="submit">Entrar</button>
        </form>
    </div>
</section>
{% endblock %}
