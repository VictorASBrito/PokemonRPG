name: Ações no retrato e Campo em pausa - 10E.4.2

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/10e4-2-transformacoes-retrato-campo-pausado]

permissions:
  contents: read

jobs:
  retrato-campo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Testar ações, captura e regressões
        run: |
          python -m pytest -q tests/test_campo_pausado_10e4_2.py tests/test_hordas_capturaveis_10e4_2.py tests/test_painel_expandido_evolucao_10e4_1.py tests/test_mega_alternativas_10e4.py tests/test_evolucao_efetiva_10e3_3_4.py tests/test_campo_compartilhado.py tests/test_campo_npcs_10d4.py tests/test_npcs_ankar_10d4.py tests/test_capturaveis_atribuicao.py tests/test_capturaveis_campo.py
