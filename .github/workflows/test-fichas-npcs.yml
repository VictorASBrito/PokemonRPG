name: Fichas de NPCs fixos - Ankar

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/10d4-4-fichas-npcs]

permissions:
  contents: read

jobs:
  fichas-npc:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validar fichas, NPCs, catálogo e Campo
        run: |
          python -m pytest -q tests/test_fichas_npcs_10d4_4.py tests/test_migration_ficha_npcs.py tests/test_npcs_10d4_3.py tests/test_npcs_ankar_10d4.py tests/test_campo_npcs_10d4.py tests/test_campo_compartilhado.py tests/test_catalogo_admin.py
