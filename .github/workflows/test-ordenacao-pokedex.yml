name: Sequência de Pokédex - Catálogo

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/10e1-ordenacao-pokedex]

permissions:
  contents: read

jobs:
  ordenacao:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Testar ordem, catálogo e criação
        run: |
          python -m pytest -q tests/test_ordenacao_pokedex_10e1.py tests/test_catalogo_admin.py tests/test_pesquisas_dinamicas.py tests/test_npcs_10d4_3.py tests/test_gerador_npcs_ankar.py
