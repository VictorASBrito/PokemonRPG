name: Pokédex - ordenação e recuperação

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/services/pokedex_service.py'
      - 'app/services/pokemon_db_service.py'
      - 'app/services/catalogo_admin_service.py'
      - 'app/services/importacao/catalogo_importer.py'
      - 'app/commands/catalogo.py'
      - 'tests/test_pokedex_ordenacao.py'
      - 'data/catalogo/pokemons.json'
      - '.github/workflows/test-pokedex.yml'

permissions:
  contents: read

jobs:
  pokedex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Testar Pokédex e regressões do catálogo
        run: |
          python -m pytest -q tests/test_pokedex_ordenacao.py tests/test_catalogo_admin.py tests/test_importacao_fontes.py
