name: NPCs - catálogo, geração e capturáveis

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/10d4-3-npcs-catalogo-manual-capturaveis]

permissions:
  contents: read

jobs:
  npc-10d4-3:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: NPCs, Campo e Capturáveis
        run: |
          python -m pytest -q tests/test_npcs_10d4_3.py tests/test_migration_espelho_npcs.py tests/test_npcs_ankar_10d4.py tests/test_gerador_npcs_ankar.py tests/test_campo_npcs_10d4.py tests/test_campo_compartilhado.py tests/test_capturaveis_campo.py tests/test_capturaveis_atribuicao.py tests/test_capturaveis_shiny_carrossel.py tests/test_catalogo_admin.py
