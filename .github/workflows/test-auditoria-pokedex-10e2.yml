name: Auditoria da Pokédex - 10E.2.1

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/10e2-1-auditoria-pokedex]

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Regressões da auditoria e números da Pokédex
        run: |
          python -m pytest -q tests/test_auditoria_pokedex_10e2_1.py tests/test_ordenacao_pokedex_10e1.py tests/test_catalogo_admin.py
