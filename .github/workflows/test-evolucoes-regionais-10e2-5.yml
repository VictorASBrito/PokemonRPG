name: Evoluções regionais 10E.2.5

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/10e2-5-evolucoes-regionais]

permissions:
  contents: read

jobs:
  regionais:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Auditar e testar relações regionais e regressões
        run: |
          python -m pytest -q tests/test_evolucoes_regionais_10e2_5.py tests/test_importacao_evolucoes_10e2_4.py tests/test_arvore_evolutiva_10e2_3.py tests/test_evolucoes_admin_10e2_2.py tests/test_catalogo_admin.py tests/test_auditoria_pokedex_10e2_1.py
