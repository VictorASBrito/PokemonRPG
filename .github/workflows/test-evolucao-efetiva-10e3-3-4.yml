name: Evolução efetiva transacional - 10E.3.3/4

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/10e3-3-4-evolucao-efetiva-transacional]

permissions:
  contents: read

jobs:
  evolucao-transacional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validar evolução, inventário e regressões
        run: |
          python -m pytest -q tests/test_evolucao_efetiva_10e3_3_4.py tests/test_autorizacao_evolucao_10e3_2.py tests/test_consulta_evolucao_10e3_1.py tests/test_evolucoes_regionais_10e2_5.py tests/test_importacao_evolucoes_10e2_4.py tests/test_equipe_pokemon.py tests/test_boxes.py tests/test_itens_inventario.py
