name: Contrato visual e organização do repositório

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  visual-repositorio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências de desenvolvimento
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Validar design system, templates, navegação e organização
        run: |
          python -m pytest -q \
            tests/test_contrato_visual_repositorio.py \
            tests/test_sistema_ui.py \
            tests/test_navegacao_mobile_10f1.py \
            tests/test_refinamento_frontend.py \
            tests/test_visual_10c5.py \
            tests/test_padrao_visual_10d1.py \
            tests/test_padronizacao_dashboard.py
