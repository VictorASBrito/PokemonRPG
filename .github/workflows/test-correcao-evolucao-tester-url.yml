name: Correção de evolução tester e fichas por URL

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/10e3-4-permissao-evolucao-tester-url]

permissions:
  contents: read

jobs:
  corrigir-autorizacao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validar tester, URLs de jogador e evolução
        run: |
          python -m pytest -q tests/test_correcao_evolucao_tester_url.py tests/test_evolucao_efetiva_10e3_3_4.py tests/test_fichas_por_url_10b3_flask.py tests/test_permissoes_edicao_tipos.py tests/test_autorizacao_evolucao_10e3_2.py tests/test_consulta_evolucao_10e3_1.py
