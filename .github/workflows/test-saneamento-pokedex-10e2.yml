name: Saneamento controlado da Pokédex - 10E.2.1.2

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/10e2-1-2-saneamento-controlado]

permissions:
  contents: read

jobs:
  saneamento:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Regressoes do saneamento, auditoria, ordenacao e importacao
        run: |
          python -m pytest -q tests/test_saneamento_pokedex_10e2_1_2.py tests/test_auditoria_pokedex_10e2_1.py tests/test_ordenacao_pokedex_10e1.py tests/test_importacao_fontes.py tests/test_catalogo_admin.py
