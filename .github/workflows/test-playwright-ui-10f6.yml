name: Playwright - interface real (SQLite isolado)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências de teste
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Instalar Chromium e dependências do sistema
        run: python -m playwright install --with-deps chromium

      - name: Executar testes visuais com Flask e SQLite de teste
        run: |
          python -m pytest -q tests/visual \
            --browser chromium \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --output test-results

      - name: Publicar screenshots e rastros Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-interface-10f6
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
