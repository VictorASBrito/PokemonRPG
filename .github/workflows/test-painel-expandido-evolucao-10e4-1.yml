name: Ações no painel expandido e Mega no menu mestre - 10E.4.1

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/10e4-1-painel-expandido-acoes-mega-gestao]

permissions:
  contents: read

jobs:
  painel-expandido:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validar ações e regressões das evoluções e Mega
        run: |
          python -m pytest -q tests/test_painel_expandido_evolucao_10e4_1.py tests/test_mega_alternativas_10e4.py tests/test_evolucao_efetiva_10e3_3_4.py tests/test_correcao_evolucao_tester_url.py tests/test_consulta_evolucao_10e3_1.py tests/test_autorizacao_evolucao_10e3_2.py tests/test_fichas_por_url_10b3_flask.py tests/test_equipe_pokemon.py tests/test_boxes.py tests/test_itens_inventario.py
