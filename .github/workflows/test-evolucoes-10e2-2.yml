name: Editor de evoluções e formas - 10E.2.2

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/10e2-2-editor-relacoes-pokemon]

permissions:
  contents: read

jobs:
  relacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Testar editor de evoluções e regressões do catálogo
        run: |
          python -m pytest -q tests/test_evolucoes_admin_10e2_2.py tests/test_catalogo_admin.py tests/test_auditoria_pokedex_10e2_1.py tests/test_ordenacao_pokedex_10e1.py
